repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Sprites, UI snapshots and the README screenshots are whitespace-significant; never rewrite them.
      - id: trailing-whitespace
        exclude: ^src/tama/assets/sprites/|/__snapshots__/|^docs/images/
      - id: end-of-file-fixer
        exclude: /__snapshots__/|^docs/images/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  # Tool hooks run via `uv run` so they use the exact versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
