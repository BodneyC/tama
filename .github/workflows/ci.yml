name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run coverage report --include='src/tama/domain/*' --fail-under=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-report-${{ matrix.os }}-${{ matrix.python }}
          path: snapshot_report.html
          if-no-files-found: ignore

  # Build the wheel and play it as installed, away from src/: proves the package carries its
  # sprites, palettes and stylesheet and that the `tama` entry point works.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv build
      - name: Smoke-test the installed tama
        env:
          TAMA_DATA_DIR: ${{ runner.temp }}/tama-data
          TAMA_CONFIG_PATH: ${{ runner.temp }}/no-config.toml
        run: |
          wheel=$(ls dist/tama-*.whl)
          tama() { uvx --python ${{ matrix.python }} --from "$wheel" tama "$@"; }
          tama --version
          tama --list-species | grep -q owl
          uv run --no-project --python ${{ matrix.python }} --with "$wheel" \
            python -I tools/smoke.py "$TAMA_DATA_DIR"
          tama --status | tee status.txt
          grep -q "Mochi" status.txt
          tama journal --pet Mochi
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: dist
          path: dist/
