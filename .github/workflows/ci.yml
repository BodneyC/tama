name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # macOS is disabled for now: its runners can queue for a long time and bill at 10x on
  # private repos. To restore it, uncomment the schedule below and macos-latest in the
  # matrix (ideally running macOS on every push/PR again by M7, see docs/ROADMAP.md).
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # , macos-latest
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run coverage report --include='src/tama/domain/*' --fail-under=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-report-${{ matrix.os }}-${{ matrix.python }}
          path: snapshot_report.html
          if-no-files-found: ignore
