[project]
name = "tama"
version = "0.1.0"
description = "A terminal virtual pet with animations and persistent state."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "BodneyC" }]
classifiers = [
    "Environment :: Console :: Curses",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.86",
    "pydantic>=2.9",
    "platformdirs>=4.3",
    "typer>=0.12",
]

[project.scripts]
tama = "tama.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-textual-snapshot>=1.0",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "textual-dev>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tama"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RET", "PTH",
    "PL", "RUF", "TCH", "ANN", "D", "S", "PT", "ERA", "TRY", "FBT", "PIE", "LOG",
]
ignore = [
    "D100", "D104", "D105", "D107",  # module/package/magic/__init__ docstrings
    "D203", "D213",                  # conflicting docstring styles (we use D211/D212)
    "PLR2004",                       # magic values: fine in a game with a Balance object
    "TRY003",
    "S311",                          # `random` drives gameplay, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR0913", "FBT"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "explicit-override"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov=tama", "--cov-report=term-missing"]
markers = ["slow: slower tests (long simulations, many hypothesis examples)"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tama"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "@overload", "raise NotImplementedError"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "tama"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["tama.ui", "tama.services", "tama.persistence", "tama.domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure (no third-party / IO libs)"
type = "forbidden"
source_modules = ["tama.domain"]
forbidden_modules = ["textual", "rich", "pydantic", "platformdirs", "typer", "tama.infra"]
allow_indirect_imports = false
